name: Draft Release from Release Branch

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  draft-release:
    name: Build & Create Draft Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all branches & history so we can verify branch ancestry

      - name: Verify Tag is on 'release' Branch
        run: |
          echo "Verifying that tag ${{ github.ref_name }} was cut from the 'release' branch..."
          git fetch origin release:refs/remotes/origin/release
          if ! git merge-base --is-ancestor HEAD origin/release; then
            echo "::error::Tag '${{ github.ref_name }}' (commit ${{ github.sha }}) does NOT belong to the 'release' branch!"
            echo "According to the Git Flow release policy, release tags must only be created from the 'release' branch."
            exit 1
          fi
          echo "Verification passed: commit belongs to origin/release."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint & Type Check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build Extension (Chrome & Firefox)
        run: |
          npm run build:chrome
          npm run build:firefox

      - name: Package Release Archives (.zip)
        run: |
          TAG="${{ github.ref_name }}"
          
          # Package Chrome extension
          cd dist
          zip -r "../cowatcher-chrome-${TAG}.zip" ./*
          cd ..
          
          # Package Firefox extension
          cd dist-firefox
          zip -r "../cowatcher-firefox-${TAG}.zip" ./*
          cd ..
          
          ls -lh cowatcher-*.zip

      - name: Detect Pre-release
        id: check-prerelease
        run: |
          # If the tag contains a hyphen (e.g. v1.0.5-beta.1, v1.0.0-rc.1), mark as pre-release
          if [[ "${{ github.ref_name }}" =~ - ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Detected pre-release tag: ${{ github.ref_name }}"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Detected stable release tag: ${{ github.ref_name }}"
          fi

      - name: Create or Update Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.check-prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            cowatcher-chrome-*.zip
            cowatcher-firefox-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
